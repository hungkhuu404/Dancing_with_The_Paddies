name: Backend contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        run: python -m pip install -r requirements-s6.txt
      - name: Core and comparison regressions
        run: python -I -m pytest -q tests/core tests/validate
      - name: Protocol regression suite
        run: python -I -m pytest -q tests/bang1/tests --bang1-adapter pipeline/core/bang1_adapter.py --bang1-require-adapter
      - name: Check effective site configuration
        run: |
          python pipeline/core/check_inputs.py --config config/sites/tan_hoi.toml --config-only
          python pipeline/core/check_inputs.py --config config/sites/bang_rakam.toml --config-only
      - name: Verify approved S7 snapshots
        run: |
          python pipeline/export/verify.py --data data --site tan_hoi
          python pipeline/export/verify.py --data data --site bang_rakam
