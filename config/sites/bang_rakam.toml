# Accepted 12 km study frame. Replay inputs are described in
# docs/pipeline-replay.md. Paths are relative to this file.
site = "bang_rakam"
# Quy ước date_local của spec mục 5.3, UTC+07:00.
timezone = "Asia/Bangkok"

[grid]
epsg = 32647
cell_size_m = 250
bbox_utm_m = [613250, 1846250, 625250, 1858250]

[catalog]
collections = ["NISAR_L2_GCOV_PROVISIONAL_V1", "NISAR_L2_GCOV_V1"]
mode = "DHDH"
required_polarizations = ["HH", "HV"]
# Research_log.md DEC-PLAN-007: khoảng 20 cảnh, trước khi loại 3 SHSH.
# Ngày địa phương Asia/Bangkok; không xác nhận mức hoàn tất S1–S7.
start_date_local = 2026-08-13
end_date_local = 2026-10-31
keep_latest_crid_per_acquisition = true
output_file = "../../runtime/bang_rakam/catalog.csv"

[[catalog.passes]]
track = "011"
direction = "A"
frame = "010"

[[catalog.passes]]
track = "112"
direction = "A"
frame = "010"

[[catalog.passes]]
track = "105"
direction = "D"
frame = "080"

[boundary]
file = "../../data/bang_rakam/aoi.geojson"
epsg = 4326
cell_inclusion = "center_in_boundary"

[read]
gcov_group = "/science/LSAR/GCOV/grids/frequencyA"
layers = ["HHHH", "HVHV"]
token_file_env = "EARTHDATA_TOKEN_FILE"
cache_dir = "../../cache/bang_rakam"
network_retries = 2

[thresholds]
# Published Q0 defaults; per-acquisition Q1 is recomputed from native references.
hh_db = -14.0
hv_db = -20.0
min_valid_pixel_fraction = 0.70
filter_single_anomaly = true

[references.water]
status = "confirmed_for_run_by_Quan"
epsg = 32647
bbox_utm_m = [618500, 1846250, 619000, 1847250]
min_pixels = 1000
selection_basis = "WorldCover 2021 BANG-2 mean water share 0.9698375; Quân confirmed in current task. Native sample count required."

[references.stable]
status = "confirmed_for_run_by_Quan"
epsg = 32647
bbox_utm_m = [619000, 1852500, 619250, 1852750]
selection_basis = "WorldCover 2021 BANG-2 builtup_share 0.9350; Quân confirmed in current task."

[landcover]
file = "../../runtime/bang_rakam/bang_rakam_landcover.csv"

[dswx]
tiles = ["T47QPU"]

[readiness]
s0_inputs_complete = true
later_stage_missing = []
# Config values are resolved; local catalogue, landcover and raster caches are required.
